[package]
name = "snap-box"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Sub-second Copy-on-Write sandbox pool orchestration engine for AI coding agents and CI/CD workloads"
license = "MIT"
keywords = ["sandbox", "copy-on-write", "apfs", "overlayfs", "ai-agents"]
categories = ["development-tools", "os", "virtualization"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "pool_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
